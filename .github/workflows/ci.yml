name: ci

on:
  pull_request:
    branches:
      - develop
      - main
    # edited: re-run when the base branch (guard-main) or the title (pr-title) changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - develop
      - main

permissions: {}

# On pull_request several events (opened, edited, labeled, milestoned) start runs for the same commit
# and a concurrency group keeps only one pending run and cancels the others; GitHub counts cancelled
# required checks as failures (PR #111 blocked).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Job names are the required status checks of the rulesets (EN-02): renaming one is a breaking change.
# Every job runs on every event and reports a status; conditions live on steps, never on jobs.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 keeps both parents of the PR merge commit (the base is its first parent).
          fetch-depth: 2
          persist-credentials: false

      # Gate files come from the PR base commit, so a PR cannot weaken its own gates: the PR version is
      # removed (including files it adds under these paths) and the base version is restored. The change
      # is only enforced once merged. Push events are untouched. Defined once here (YAML anchor), reused
      # by the other jobs; it must not live in a gate file, which would come from the PR.
      # The base is the first parent of the PR merge commit (checkout fetch-depth >= 2), not
      # pull_request.base.sha: that one can be older than the target branch and cannot be fetched by SHA
      # without a token on a private repository.
      - &restore-gates
        name: Restore gate files from the PR base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            echo "HEAD is not a pull request merge commit, cannot determine the base." >&2
            exit 1
          fi
          base="$(git rev-parse --verify 'HEAD^1')"
          # Entries are git pathspecs: plain names match a file or a whole directory, ':(glob)' entries
          # are patterns ('**/' also matches the repository root). Keep in sync with docs/adr/0010.
          specs=(
            # Explicit gate files, called directly by CI or the Taskfile.
            Taskfile.yml taskfiles .mise.toml mise.lock .mise .checkov.yaml .tflint.hcl
            .gitleaks.toml commitlint.config.mjs policies scripts/ci .github/actions .github/scripts
            # Implicit configuration the tools load on their own when present.
            mise.toml .config/mise.toml .config/mise mise.local.toml .mise.local.toml .tool-versions
            trivy.yaml .trivyignore .trivyignore.yaml
            .gitleaksignore
            ':(glob)**/.checkov.yml' ':(glob)**/.checkov.yaml'
            .commitlintrc ':(glob).commitlintrc.*' package.json
            .github/actionlint.yaml .github/actionlint.yml
            zizmor.yml .github/zizmor.yml
            .shellcheckrc .github/.shellcheckrc
          )
          changed="$(git diff --name-only "${base}" HEAD -- "${specs[@]}" | paste -sd, - | sed 's/,/, /g')"
          if [ -n "${changed}" ]; then
            echo "::warning title=Gate files differ from base::This PR changes gate files (${changed}). CI runs with the base version; the change will only be enforced after merge."
          fi
          # Delete the PR version, then restore what exists in the base. A failure of any git command
          # stops the job (set -e): the step fails closed.
          git rm -rfq --ignore-unmatch -- "${specs[@]}"
          list="$(mktemp)"
          git diff --cached --name-only -z --diff-filter=D "${base}" -- "${specs[@]}" > "${list}"
          # Never run checkout without paths: it would switch the whole tree to the base.
          if [ -s "${list}" ]; then
            git --literal-pathspecs checkout "${base}" --pathspec-from-file="${list}" --pathspec-file-nul
          fi
          rm -f "${list}"
          # Postcondition: the working tree matches the base on every gate path.
          git diff --quiet "${base}" -- "${specs[@]}"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          tools: >-
            aqua:go-task/task
            aqua:opentofu/opentofu
            aqua:terraform-linters/tflint
            aqua:rhysd/actionlint
            aqua:zizmorcore/zizmor
            aqua:koalaman/shellcheck

      - name: Format check
        run: task fmt:check

      - name: Lint and validate
        run: task lint

      # Contract tests of the CI workflows (EN-73): static, no network, no AWS credentials.
      - name: Workflow contract tests
        if: hashFiles('tests/ci/iac-apply.test.sh') != ''
        run: bash tests/ci/iac-apply.test.sh

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the git history of the branch.
          fetch-depth: 0
          persist-credentials: false

      - *restore-gates

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          tools: >-
            aqua:go-task/task
            aqua:gitleaks/gitleaks
            aqua:aquasecurity/trivy
            python
            uv
            pipx:checkov

      - name: Security scans
        run: task sec

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - *restore-gates

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          tools: >-
            aqua:go-task/task
            aqua:opentofu/opentofu
            python
            uv

      - name: Unit tests
        run: task test:unit

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - *restore-gates

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          tools: >-
            aqua:go-task/task
            aqua:terraform-docs/terraform-docs

      - name: Module docs are up to date
        run: task docs:check

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - *restore-gates

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          tools: >-
            node
            npm:pnpm

      # Call pnpm directly, not `task contracts`: the Taskfile is restored from the PR base
      # by restore-gates, so a task added in this PR is not yet present. packages/contracts is
      # not a gate file, so it keeps its PR version. `task contracts` stays for local use.
      - name: Lint contract and compile schemas
        run: |
          pnpm --dir packages/contracts install --frozen-lockfile
          pnpm --dir packages/contracts run check

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - *restore-gates

      - name: Setup toolchain
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          tools: >-
            node
            npm:@commitlint/cli

      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # Explicit config: commitlint would otherwise pick package.json or .commitlintrc* first.
        run: printf '%s' "$TITLE" | commitlint --config commitlint.config.mjs

      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "pr-title only applies to pull requests, nothing to check."

  guard-main:
    name: guard-main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read # list the files of a release PR
    steps:
      - name: Only develop or release-please branches may target main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "main" ]; then
            echo "Not a pull request targeting main, nothing to guard."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Pull requests to main must come from a branch of this repository, not a fork." >&2
            exit 1
          fi
          case "$HEAD_REF" in
            develop)
              echo "Head branch accepted for main."
              ;;
            release-please--*)
              # The branch name alone can be forged by anyone with push access.
              if [ "$PR_AUTHOR" != "github-actions[bot]" ]; then
                echo "release-please--* branches are only accepted from release-please (github-actions[bot])." >&2
                exit 1
              fi
              # The author can be impersonated and anyone with push access can add commits to the branch:
              # a release PR may only touch the files release-please writes.
              files="$(gh api --paginate "repos/${BASE_REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
              unexpected="$(printf '%s\n' "$files" | grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|version\.txt' || true)"
              if [ -n "$unexpected" ]; then
                echo "A release PR may only change CHANGELOG.md, .release-please-manifest.json and version.txt. Unexpected:" >&2
                printf '%s\n' "$unexpected" >&2
                exit 1
              fi
              echo "release-please branch accepted for main."
              ;;
            *)
              echo "Pull requests to main must come from develop or release-please--* branches." >&2
              exit 1
              ;;
          esac
