name: iac-apply

# GitOps apply of the infrastructure (EN-73, ADR-0009): push on develop applies `dev`, push on main applies `prod`.
# A manual run (workflow_dispatch) is accepted from develop only and applies `dev`; `prod` is applied by a push on main.
# Stacks are applied in order, foundation then platform, one job each. Every job computes its own plan and applies
# THAT file (frozen plan): there is no re-plan between the two steps, and OpenTofu refuses a plan whose state is stale.
# Identity (ADR-0016, which completes ADR-0012): OIDC takes priority when the variable AWS_APPLY_ROLE_ARN of the
# environment is set (apply role trusted only on `sub = repo:<org>/<repo>:environment:<env>`). Otherwise `dev` uses
# the workshop SESSION credentials stored as secrets of the `dev` environment, which only `develop` can deploy to, so
# no pull request ever sees them. `prod` is OIDC only. The `prod` environment requires a reviewer, so the approval happens
# BEFORE a prod job starts and the plan it computes is the one that gets applied. The approval therefore covers the
# release diff (develop -> main PR) and the dev apply of the same commit, see docs/runbooks/iac-apply.md.
# Before each apply, the job summary lists the planned actions and resource addresses (never attribute values).
# The plan is never printed, never uploaded; the state is never uploaded either.
on:
  push:
    branches:
      - develop
      - main
    paths:
      - infra/**
  workflow_dispatch: {}

permissions: {}

# One apply at a time per environment, never cancelled midway (a cancelled apply leaves a locked, half-applied
# state). A run waiting behind another is replaced by a newer waiting run: it applies the newest commit, which
# contains the older one. A run the `target` job rejects (any ref other than develop/main, or a manual run on main)
# gets a unique group so it cannot displace a legitimate run.
concurrency:
  group: iac-apply-${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') && 'prod' || (github.ref == 'refs/heads/develop' && 'dev' || format('rejected-{0}', github.run_id)) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  # Maps the ref to the GitHub environment. No environment, no credentials, no checkout.
  target:
    name: target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - name: Resolve the target environment
        id: resolve
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}:${REF}" in
            push:refs/heads/develop | workflow_dispatch:refs/heads/develop) target=dev ;;
            push:refs/heads/main) target=prod ;;
            workflow_dispatch:*)
              echo "::error title=Apply refused::A manual run is accepted from develop only (dev). prod is applied by merging into main."
              exit 1
              ;;
            *)
              echo "::error title=Apply refused::Only develop (dev) and main (prod) can be applied."
              exit 1
              ;;
          esac
          echo "env=${target}" >> "$GITHUB_OUTPUT"

  apply-foundation:
    # Name format is stable: `apply (<stack>)`. The environment gate (prod reviewer) is evaluated before this job starts.
    name: apply (foundation)
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # the role session lasts 3600 s (ADR-0012)
    environment: ${{ needs.target.outputs.env }}
    permissions:
      id-token: write # assume the apply role through OIDC (OIDC mode only; unused in secrets mode)
      contents: read
    steps:
      # Decide first, before anything is checked out or installed. Everything below is conditioned on `enabled`.
      # Authentication mode (ADR-0016): OIDC when the apply role variable is set (priority), else the workshop session
      # credentials of the `dev` environment (secrets mode), else nothing. The secret values never reach this step: it
      # only receives a boolean saying whether all three exist.
      - name: Check prerequisites
        id: gate
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
          HAS_SESSION_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SESSION_TOKEN != '' }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          set -euo pipefail
          {
            echo "enabled=false"
            echo "mode=none"
          } >> "$GITHUB_OUTPUT"
          case "${EVENT_NAME}" in
            push | workflow_dispatch) ;;
            *)
              echo "::error title=Apply refused::Event ${EVENT_NAME} can never apply: credentials are for push and manual runs on a deployable branch only."
              exit 1
              ;;
          esac
          mode=none
          if [ -n "$APPLY_ROLE_ARN" ]; then
            mode=oidc
          elif [ "$TARGET_ENV" = "dev" ] && [ "$HAS_SESSION_CREDENTIALS" = "true" ]; then
            # Session credentials are for dev from develop only (also enforced by the environment branch policy).
            if [ "$REF" != "refs/heads/develop" ]; then
              echo "::error title=Apply refused::Session credentials are only used from develop."
              exit 1
            fi
            mode=secrets
          fi
          if [ "$mode" = "none" ]; then
            if [ "$TARGET_ENV" = "prod" ]; then
              echo "::error title=Apply refused::prod needs the OIDC role (variable AWS_APPLY_ROLE_ARN of the prod environment); session credentials are never used for prod. prod is not deployed during the workshop (ADR-0016)."
              exit 1
            fi
            echo "::notice title=Apply skipped::No credentials for the ${TARGET_ENV} environment: variable AWS_APPLY_ROLE_ARN is empty and the secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN are not all set (expired or never set). See docs/runbooks/ci-variables.md."
            exit 0
          fi
          if [ -z "$STATE_KMS_KEY_ARN" ]; then
            echo "::error title=Missing variable::Credentials are configured (${mode}) but STATE_KMS_KEY_ARN is empty: the apply cannot decrypt the state. See docs/runbooks/ci-variables.md."
            exit 1
          fi
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error title=Missing variable::Credentials are configured (${mode}) but STATE_BUCKET is empty: the apply cannot reach the state. See docs/runbooks/ci-variables.md."
            exit 1
          fi
          echo "Authentication mode: ${mode}"
          {
            echo "enabled=true"
            echo "mode=${mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install tools before the credentials exist, so third-party installers never run with AWS access.
      - name: Setup toolchain
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          # No cache in a job that holds id-token: write: a cache written from another branch must not feed it.
          cache: "false"
          tools: >-
            aqua:go-task/task
            aqua:opentofu/opentofu

      # Same gate as the PR plan: providers are downloaded HERE, with no AWS credentials, into a fixed cache and
      # checked against the allowlist. The credentialed init below only reads that cache (-plugin-dir).
      - name: Pre-flight (provider allowlist, no credentials yet)
        if: steps.gate.outputs.enabled == 'true'
        env:
          STACK: foundation
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          # `tofu init` loads HCL while this job holds `id-token: write`: no OIDC token for it.
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          task plan:preflight STACK="$STACK"

      # Credentials are given through the inputs only (never `env:`), and only those of the selected mode. The action
      # masks and exports them to the next steps, which is what the AWS SDK needs; the OIDC request variables are
      # blanked in every step after this one.
      - name: Authenticate to AWS (OIDC or session credentials)
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/aws-auth # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          role-to-assume: ${{ steps.gate.outputs.mode == 'oidc' && vars.AWS_APPLY_ROLE_ARN || '' }}
          aws-access-key-id: ${{ steps.gate.outputs.mode == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ steps.gate.outputs.mode == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-session-token: ${{ steps.gate.outputs.mode == 'secrets' && secrets.AWS_SESSION_TOKEN || '' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Refuse to apply anything but the current head of the branch. Re-running an old run would otherwise plan and
      # apply that run's older commit and silently roll the environment back. Runs before OpenTofu: no HCL is loaded.
      - name: Check the commit is the branch head (foundation)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${REF_NAME}" --jq .object.sha)"
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error title=Stale run::This run is for ${GITHUB_SHA}, but ${REF_NAME} is now at ${head_sha}. Applying it would roll the environment back. Dispatch or re-run the latest run only."
            exit 1
          fi

      # From here on every step blanks ACTIONS_ID_TOKEN_REQUEST_TOKEN / _URL (env, then `unset`): HCL runs in these
      # steps and could otherwise mint OIDC tokens for any audience.
      # The plan file lives in the runner temp directory, encrypted by the OpenTofu `encryption` block
      # (plan.enforced = true), and is never uploaded. Plan and apply output go to files and are never printed: only
      # the exit code and OpenTofu's `Error:` summary lines reach the log.
      - name: Plan (foundation)
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: foundation
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          # JSON list of IAM principals that administer the keys (not in the repository, see the runbook).
          TF_VAR_admin_principal_arns: ${{ vars.TF_VAR_admin_principal_arns }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_CLI_ARGS_init: -no-color -plugin-dir=${{ runner.temp }}/tf-plugin-cache
          TF_CLI_ARGS_plan: -no-color
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          output="${RUNNER_TEMP}/apply-plan-output.txt"
          plan_file="${RUNNER_TEMP}/apply-${STACK}.tfplan"
          rm -f "${plan_file}"
          rc=0
          task plan ENV="${TARGET_ENV}" STACK="${STACK}" OUT="${plan_file}" > "${output}" 2>&1 || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error title=Plan failed::task plan exited with code ${rc} for ${TARGET_ENV} / ${STACK}. The plan output is not printed."
            { grep -E '^(Error|│ Error):' "${output}" | head -n 5 | cut -c1-300; } || true
            exit "${rc}"
          fi

      # Reviewability: planned actions and resource addresses only (never attribute values), written to the job
      # summary BEFORE the apply. Informational: a failure here is a warning and does not block the apply, and it is
      # not an approval gate (the prod gate is the environment reviewer, evaluated before the job, see the runbook).
      # Reads the same plan file as the apply step (decrypted by the OpenTofu `encryption` block).
      - name: Plan summary (foundation)
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: foundation
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          plan_file="${RUNNER_TEMP}/apply-${STACK}.tfplan"
          raw="${RUNNER_TEMP}/apply-${STACK}.changes"
          safe="${RUNNER_TEMP}/apply-${STACK}.changes.safe"
          if [ ! -f "${plan_file}" ]; then
            exit 0
          fi
          if ! tofu -chdir="infra/stacks/${STACK}" show -json "${plan_file}" 2> /dev/null \
            | jq -r '(.resource_changes // [])[] | select(.change.actions | . != ["no-op"] and . != ["read"]) | "\(.change.actions | join("+")) \(.address)"' > "${raw}"; then
            echo "::warning title=Plan summary unavailable::Could not read the plan for ${TARGET_ENV} / ${STACK}. The apply is not blocked by this."
            exit 0
          fi
          # Addresses can carry for_each keys: keep a conservative character set so nothing odd reaches the markdown.
          tr -c 'A-Za-z0-9_.[]"+ :/\n-' '?' < "${raw}" > "${safe}"
          count() { { grep -cE "$1" "${safe}"; } || true; }
          {
            echo "### Plan summary: ${TARGET_ENV} / ${STACK}"
            echo
            echo "Actions and resource addresses only, no attribute values. Informational, computed just before the apply."
            echo
            echo "| Create | Update | Replace | Delete |"
            echo "|---|---|---|---|"
            echo "| $(count '^create ') | $(count '^update ') | $(count '^(delete\+create|create\+delete) ') | $(count '^delete ') |"
            echo
            if [ -s "${safe}" ]; then
              echo '```text'
              head -n 200 "${safe}"
              echo '```'
              if [ "$(wc -l < "${safe}")" -gt 200 ]; then
                echo "List truncated to 200 lines."
              fi
            else
              echo "No change planned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies exactly the file written by the step above. No re-plan, no -auto-approve (see `task apply`). If the
      # state changed in between, OpenTofu rejects the plan as stale and the job fails: re-run the workflow.
      - name: Apply the saved plan (foundation)
        id: apply
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: foundation
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          # JSON list of IAM principals that administer the keys (not in the repository, see the runbook).
          TF_VAR_admin_principal_arns: ${{ vars.TF_VAR_admin_principal_arns }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_CLI_ARGS_init: -no-color -plugin-dir=${{ runner.temp }}/tf-plugin-cache
          TF_CLI_ARGS_apply: -no-color
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          output="${RUNNER_TEMP}/apply-output.txt"
          plan_file="${RUNNER_TEMP}/apply-${STACK}.tfplan"
          result="${RUNNER_TEMP}/apply-${STACK}.result"
          : > "${result}"
          # `task plan` writes no file when the stack or the environment directory does not exist yet.
          if [ ! -f "${plan_file}" ]; then
            echo "::notice title=Nothing to apply::No plan file for ${TARGET_ENV} / ${STACK} (stack or environment directory missing)."
            echo "Nothing to apply (no stack or environment directory)." > "${result}"
            exit 0
          fi
          rc=0
          task apply ENV="${TARGET_ENV}" STACK="${STACK}" PLAN="${plan_file}" > "${output}" 2>&1 || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error title=Apply failed::task apply exited with code ${rc} for ${TARGET_ENV} / ${STACK}. The apply output is not printed. Part of the plan may have been applied: re-run the workflow to compute a new plan."
            if grep -qi 'saved plan is stale' "${output}"; then
              echo "::error title=Stale plan::The state changed after the plan was computed, so the plan was rejected. Re-run the workflow to compute a new plan."
            fi
            { grep -E '^(Error|│ Error):' "${output}" | head -n 5 | cut -c1-300; } || true
            exit "${rc}"
          fi
          # Counts only, matched against a strict pattern so no other text can reach the summary.
          { grep -E '^Apply complete! Resources: [0-9]+ added, [0-9]+ changed, [0-9]+ destroyed\.$' "${output}" | tail -n 1; } > "${result}" || true
          if [ ! -s "${result}" ]; then
            echo "Apply finished (no resource count reported)." > "${result}"
          fi

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: foundation
          ENABLED: ${{ steps.gate.outputs.enabled }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          # Untrusted (commit message): only a validated PR number is extracted from it.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          first_line="$(printf '%s\n' "${HEAD_MESSAGE}" | head -n 1)"
          pr="n/a"
          merge_re='^Merge pull request #([0-9]+) '
          squash_re='\(#([0-9]+)\)$'
          if [[ "${first_line}" =~ ${merge_re} ]] || [[ "${first_line}" =~ ${squash_re} ]]; then
            pr="[#${BASH_REMATCH[1]}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${BASH_REMATCH[1]})"
          fi
          result="n/a"
          if [ -s "${RUNNER_TEMP}/apply-${STACK}.result" ]; then
            result="$(head -n 1 "${RUNNER_TEMP}/apply-${STACK}.result")"
          fi
          {
            echo "### OpenTofu apply: ${TARGET_ENV} / ${STACK}"
            echo
            if [ "${ENABLED}" != "true" ]; then
              echo "Not run: no credentials configured for this environment (or prerequisites missing, see the first step)."
            else
              echo "| Item | Value |"
              echo "|---|---|"
              echo "| Environment | \`${TARGET_ENV}\` |"
              echo "| Stack | \`${STACK}\` |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo "| Pull request | ${pr} |"
              echo "| Plan | ${PLAN_OUTCOME} |"
              echo "| Apply | ${APPLY_OUTCOME} |"
              echo "| Result | ${result} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plan and output files
        if: always()
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: rm -f "${RUNNER_TEMP}"/apply-*.tfplan "${RUNNER_TEMP}"/apply-*.result "${RUNNER_TEMP}"/apply-*.changes* "${RUNNER_TEMP}"/apply-plan-output.txt "${RUNNER_TEMP}"/apply-output.txt

  apply-platform:
    name: apply (platform)
    needs: [target, apply-foundation]
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # the role session lasts 3600 s (ADR-0012)
    environment: ${{ needs.target.outputs.env }}
    permissions:
      id-token: write # assume the apply role through OIDC (OIDC mode only; unused in secrets mode)
      contents: read
    steps:
      # Authentication mode (ADR-0016): OIDC when the apply role variable is set (priority), else the workshop session
      # credentials of the `dev` environment (secrets mode), else nothing. The secret values never reach this step: it
      # only receives a boolean saying whether all three exist.
      - name: Check prerequisites
        id: gate
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
          HAS_SESSION_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SESSION_TOKEN != '' }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          set -euo pipefail
          {
            echo "enabled=false"
            echo "mode=none"
          } >> "$GITHUB_OUTPUT"
          case "${EVENT_NAME}" in
            push | workflow_dispatch) ;;
            *)
              echo "::error title=Apply refused::Event ${EVENT_NAME} can never apply: credentials are for push and manual runs on a deployable branch only."
              exit 1
              ;;
          esac
          mode=none
          if [ -n "$APPLY_ROLE_ARN" ]; then
            mode=oidc
          elif [ "$TARGET_ENV" = "dev" ] && [ "$HAS_SESSION_CREDENTIALS" = "true" ]; then
            # Session credentials are for dev from develop only (also enforced by the environment branch policy).
            if [ "$REF" != "refs/heads/develop" ]; then
              echo "::error title=Apply refused::Session credentials are only used from develop."
              exit 1
            fi
            mode=secrets
          fi
          if [ "$mode" = "none" ]; then
            if [ "$TARGET_ENV" = "prod" ]; then
              echo "::error title=Apply refused::prod needs the OIDC role (variable AWS_APPLY_ROLE_ARN of the prod environment); session credentials are never used for prod. prod is not deployed during the workshop (ADR-0016)."
              exit 1
            fi
            echo "::notice title=Apply skipped::No credentials for the ${TARGET_ENV} environment: variable AWS_APPLY_ROLE_ARN is empty and the secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN are not all set (expired or never set). See docs/runbooks/ci-variables.md."
            exit 0
          fi
          if [ -z "$STATE_KMS_KEY_ARN" ]; then
            echo "::error title=Missing variable::Credentials are configured (${mode}) but STATE_KMS_KEY_ARN is empty: the apply cannot decrypt the state. See docs/runbooks/ci-variables.md."
            exit 1
          fi
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error title=Missing variable::Credentials are configured (${mode}) but STATE_BUCKET is empty: the apply cannot reach the state. See docs/runbooks/ci-variables.md."
            exit 1
          fi
          echo "Authentication mode: ${mode}"
          {
            echo "enabled=true"
            echo "mode=${mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          # No cache in a job that holds id-token: write: a cache written from another branch must not feed it.
          cache: "false"
          tools: >-
            aqua:go-task/task
            aqua:opentofu/opentofu

      - name: Pre-flight (provider allowlist, no credentials yet)
        if: steps.gate.outputs.enabled == 'true'
        env:
          STACK: platform
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          task plan:preflight STACK="$STACK"

      # Credentials are given through the inputs only (never `env:`), and only those of the selected mode. The action
      # masks and exports them to the next steps, which is what the AWS SDK needs; the OIDC request variables are
      # blanked in every step after this one.
      - name: Authenticate to AWS (OIDC or session credentials)
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/aws-auth # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
        with:
          role-to-assume: ${{ steps.gate.outputs.mode == 'oidc' && vars.AWS_APPLY_ROLE_ARN || '' }}
          aws-access-key-id: ${{ steps.gate.outputs.mode == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ steps.gate.outputs.mode == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-session-token: ${{ steps.gate.outputs.mode == 'secrets' && secrets.AWS_SESSION_TOKEN || '' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Check the commit is the branch head (platform)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${REF_NAME}" --jq .object.sha)"
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error title=Stale run::This run is for ${GITHUB_SHA}, but ${REF_NAME} is now at ${head_sha}. Applying it would roll the environment back. Dispatch or re-run the latest run only."
            exit 1
          fi

      - name: Plan (platform)
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: platform
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_CLI_ARGS_init: -no-color -plugin-dir=${{ runner.temp }}/tf-plugin-cache
          TF_CLI_ARGS_plan: -no-color
          # SES identities (PII, sensitive): environment secrets, never printed. The sender is a plain address, the
          # recipients a JSON list of addresses (OpenTofu parses TF_VAR_ of a list type as HCL, JSON is valid).
          TF_VAR_sender_email_address: ${{ secrets.SES_SENDER_EMAIL }}
          TF_VAR_recipient_email_identities: ${{ secrets.SES_RECIPIENT_EMAILS || '[]' }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          output="${RUNNER_TEMP}/apply-plan-output.txt"
          plan_file="${RUNNER_TEMP}/apply-${STACK}.tfplan"
          rm -f "${plan_file}"
          rc=0
          task plan ENV="${TARGET_ENV}" STACK="${STACK}" OUT="${plan_file}" > "${output}" 2>&1 || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error title=Plan failed::task plan exited with code ${rc} for ${TARGET_ENV} / ${STACK}. The plan output is not printed."
            { grep -E '^(Error|│ Error):' "${output}" | head -n 5 | cut -c1-300; } || true
            exit "${rc}"
          fi

      # Same informational plan summary as foundation (actions and addresses only, before the apply).
      - name: Plan summary (platform)
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: platform
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          plan_file="${RUNNER_TEMP}/apply-${STACK}.tfplan"
          raw="${RUNNER_TEMP}/apply-${STACK}.changes"
          safe="${RUNNER_TEMP}/apply-${STACK}.changes.safe"
          if [ ! -f "${plan_file}" ]; then
            exit 0
          fi
          if ! tofu -chdir="infra/stacks/${STACK}" show -json "${plan_file}" 2> /dev/null \
            | jq -r '(.resource_changes // [])[] | select(.change.actions | . != ["no-op"] and . != ["read"]) | "\(.change.actions | join("+")) \(.address)"' > "${raw}"; then
            echo "::warning title=Plan summary unavailable::Could not read the plan for ${TARGET_ENV} / ${STACK}. The apply is not blocked by this."
            exit 0
          fi
          tr -c 'A-Za-z0-9_.[]"+ :/\n-' '?' < "${raw}" > "${safe}"
          count() { { grep -cE "$1" "${safe}"; } || true; }
          {
            echo "### Plan summary: ${TARGET_ENV} / ${STACK}"
            echo
            echo "Actions and resource addresses only, no attribute values. Informational, computed just before the apply."
            echo
            echo "| Create | Update | Replace | Delete |"
            echo "|---|---|---|---|"
            echo "| $(count '^create ') | $(count '^update ') | $(count '^(delete\+create|create\+delete) ') | $(count '^delete ') |"
            echo
            if [ -s "${safe}" ]; then
              echo '```text'
              head -n 200 "${safe}"
              echo '```'
              if [ "$(wc -l < "${safe}")" -gt 200 ]; then
                echo "List truncated to 200 lines."
              fi
            else
              echo "No change planned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the saved plan (platform)
        id: apply
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: platform
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_VAR_state_kms_key_arn: ${{ vars.STATE_KMS_KEY_ARN }}
          TF_CLI_ARGS_init: -no-color -plugin-dir=${{ runner.temp }}/tf-plugin-cache
          TF_CLI_ARGS_apply: -no-color
          # SES identities (PII, sensitive): environment secrets, never printed. The sender is a plain address, the
          # recipients a JSON list of addresses (OpenTofu parses TF_VAR_ of a list type as HCL, JSON is valid).
          TF_VAR_sender_email_address: ${{ secrets.SES_SENDER_EMAIL }}
          TF_VAR_recipient_email_identities: ${{ secrets.SES_RECIPIENT_EMAILS || '[]' }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          output="${RUNNER_TEMP}/apply-output.txt"
          plan_file="${RUNNER_TEMP}/apply-${STACK}.tfplan"
          result="${RUNNER_TEMP}/apply-${STACK}.result"
          : > "${result}"
          if [ ! -f "${plan_file}" ]; then
            echo "::notice title=Nothing to apply::No plan file for ${TARGET_ENV} / ${STACK} (stack or environment directory missing)."
            echo "Nothing to apply (no stack or environment directory)." > "${result}"
            exit 0
          fi
          rc=0
          task apply ENV="${TARGET_ENV}" STACK="${STACK}" PLAN="${plan_file}" > "${output}" 2>&1 || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error title=Apply failed::task apply exited with code ${rc} for ${TARGET_ENV} / ${STACK}. The apply output is not printed. Part of the plan may have been applied: re-run the workflow to compute a new plan."
            if grep -qi 'saved plan is stale' "${output}"; then
              echo "::error title=Stale plan::The state changed after the plan was computed, so the plan was rejected. Re-run the workflow to compute a new plan."
            fi
            { grep -E '^(Error|│ Error):' "${output}" | head -n 5 | cut -c1-300; } || true
            exit "${rc}"
          fi
          { grep -E '^Apply complete! Resources: [0-9]+ added, [0-9]+ changed, [0-9]+ destroyed\.$' "${output}" | tail -n 1; } > "${result}" || true
          if [ ! -s "${result}" ]; then
            echo "Apply finished (no resource count reported)." > "${result}"
          fi

      - name: Job summary
        if: always()
        env:
          TARGET_ENV: ${{ needs.target.outputs.env }}
          STACK: platform
          ENABLED: ${{ steps.gate.outputs.enabled }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -uo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          first_line="$(printf '%s\n' "${HEAD_MESSAGE}" | head -n 1)"
          pr="n/a"
          merge_re='^Merge pull request #([0-9]+) '
          squash_re='\(#([0-9]+)\)$'
          if [[ "${first_line}" =~ ${merge_re} ]] || [[ "${first_line}" =~ ${squash_re} ]]; then
            pr="[#${BASH_REMATCH[1]}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${BASH_REMATCH[1]})"
          fi
          result="n/a"
          if [ -s "${RUNNER_TEMP}/apply-${STACK}.result" ]; then
            result="$(head -n 1 "${RUNNER_TEMP}/apply-${STACK}.result")"
          fi
          {
            echo "### OpenTofu apply: ${TARGET_ENV} / ${STACK}"
            echo
            if [ "${ENABLED}" != "true" ]; then
              echo "Not run: no credentials configured for this environment (or prerequisites missing, see the first step)."
            else
              echo "| Item | Value |"
              echo "|---|---|"
              echo "| Environment | \`${TARGET_ENV}\` |"
              echo "| Stack | \`${STACK}\` |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo "| Pull request | ${pr} |"
              echo "| Plan | ${PLAN_OUTCOME} |"
              echo "| Apply | ${APPLY_OUTCOME} |"
              echo "| Result | ${result} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plan and output files
        if: always()
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: rm -f "${RUNNER_TEMP}"/apply-*.tfplan "${RUNNER_TEMP}"/apply-*.result "${RUNNER_TEMP}"/apply-*.changes* "${RUNNER_TEMP}"/apply-plan-output.txt "${RUNNER_TEMP}"/apply-output.txt
