name: release

on:
  push:
    branches:
      - main

permissions: {}

# Never cancel: an interrupted run could leave a tag without its GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tag, GitHub release, release branch
      pull-requests: write # open and update the release PR
      issues: write # autorelease labels on the release PR
    steps:
      # No checkout: release-please works through the GitHub API using the config files on main.
      # GITHUB_TOKEN on purpose (no secret, EN-02): workflows do not run on the PR it opens,
      # see docs/runbooks/release.md for the close/reopen step.
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
