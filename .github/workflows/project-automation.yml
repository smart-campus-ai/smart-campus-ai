name: project-automation

on:
  issues:
    types:
      - opened
      - reopened
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions: {}

concurrency:
  group: project-automation-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PROJECT_URL: https://github.com/orgs/smart-campus-ai/projects/1
  PROJECT_NUMBER: "1"

jobs:
  issue:
    name: issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check board token
        id: gate
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "${PROJECT_TOKEN}" ]; then
            echo "::warning::PROJECT_TOKEN is empty: board automation skipped."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Add issue to project
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

  pull-request:
    name: pull-request
    # Closed without merge: nothing to do on the board.
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check board token
        id: gate
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "${PROJECT_TOKEN}" ]; then
            echo "::warning::PROJECT_TOKEN is empty: board automation skipped."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Add PR to project
        id: add
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Update Status of PR and closing issues
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_ITEM_ID: ${{ steps.add.outputs.itemId }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const action = context.payload.action;

            // Draft PRs stay "In progress"; they move to "In review" when marked ready.
            let prStatus;
            let issueStatus;
            if (action === 'closed') {
              prStatus = 'Done';
              issueStatus = 'Done';
            } else if (pr.draft) {
              prStatus = 'In progress';
              issueStatus = 'In progress';
            } else {
              prStatus = 'In review';
              issueStatus = 'In progress';
            }

            // Resolve the project, the Status field and its options by name at runtime.
            const projectQuery = `query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }`;
            const projectData = await github.graphql(projectQuery, {
              org: owner,
              number: Number(process.env.PROJECT_NUMBER),
            });
            const project = projectData.organization.projectV2;
            if (!project || !project.field) {
              core.setFailed('Project or Status field not found: check PROJECT_TOKEN scopes and project number.');
              return;
            }
            const optionId = (name) => {
              const option = project.field.options.find((o) => o.name === name);
              if (!option) {
                const known = project.field.options.map((o) => o.name).join(', ');
                throw new Error(`Status option "${name}" not found (available: ${known}).`);
              }
              return option.id;
            };

            // addProjectV2ItemById is idempotent: it returns the existing item when already present.
            const addItem = async (contentId) => {
              const result = await github.graphql(
                `mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
                }`,
                { project: project.id, content: contentId }
              );
              return result.addProjectV2ItemById.item.id;
            };
            const setStatus = async (itemId, statusName) => {
              await github.graphql(
                `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`,
                { project: project.id, item: itemId, field: project.field.id, option: optionId(statusName) }
              );
            };

            const prItemId = process.env.PR_ITEM_ID || (await addItem(pr.node_id));
            await setStatus(prItemId, prStatus);
            core.info(`PR #${pr.number} -> ${prStatus}`);

            const closingData = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50) { nodes { id number } }
                  }
                }
              }`,
              { owner, repo, number: pr.number }
            );
            for (const issue of closingData.repository.pullRequest.closingIssuesReferences.nodes) {
              const issueItemId = await addItem(issue.id);
              await setStatus(issueItemId, issueStatus);
              core.info(`Issue #${issue.number} -> ${issueStatus}`);
            }
