name: setup-toolchain
description: >-
  Install the pinned toolchain with mise (versions from .mise.toml, artifacts and checksums from mise.lock).
  The caller must have checked out the repository first.

inputs:
  tools:
    description: >-
      Optional space-separated list of mise tools to install (for example "aqua:go-task/task aqua:opentofu/opentofu"),
      using the exact names of .mise.toml. Empty installs every tool.
    required: false
    default: ""
  cache:
    description: >-
      "true" restores and saves the mise tool cache; "false" neither reads nor writes it. Jobs that hold cloud
      credentials or publish (apply) must pass "false": a cache written by a lower-trust job (another branch) could
      otherwise put binaries on their PATH, and `--locked` does not recheck binaries restored from a cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Refuse a local .env file
      shell: bash
      run: |
        if [ -e .env ]; then
          echo "A .env file is present in the workspace; CI must run without one." >&2
          exit 1
        fi

    - name: Restrict mise to the pinned config file
      shell: bash
      # Constant value, no untrusted input. mise then ignores mise.toml, .mise/config.toml, .tool-versions...
      # so a config file added by a pull request cannot put its own binaries on the PATH.
      run: echo "MISE_OVERRIDE_CONFIG_FILENAMES=.mise.toml" >> "$GITHUB_ENV"

    - name: Install tools with mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        # The mise binary itself is pinned: exact version, and the sha256 of its linux-x64 binary (every workflow
        # runs on ubuntu-24.04), taken from https://mise.jdx.dev/v<version>/SHASUMS256.txt (`mise-v<version>-linux-x64`).
        # Bump both together; a mismatch fails the job.
        version: "2026.10.4"
        sha256: 2b8ce21f550872807bcaabf45b6bc5c64bfbd6dc3bf49dd4e67de700ef3ceb75
        install: "true"
        cache: ${{ inputs.cache }}
        # One cache per job: each job installs a different subset of tools.
        cache_key_prefix: mise-${{ github.job }}
        install_args: --locked ${{ inputs.tools }}
