name: aws-oidc
description: >-
  Assume an AWS role with the GitHub OIDC token (no long-lived credentials). The calling job must grant
  `id-token: write`. The role ARN comes from a GitHub variable (vars.AWS_PLAN_ROLE_ARN or vars.AWS_APPLY_ROLE_ARN),
  never from a secret.

inputs:
  role-to-assume:
    description: ARN of the IAM role to assume (GitHub variable, not a secret).
    required: true
  aws-region:
    description: Region of the STS endpoint and default region of the session.
    required: false
    default: eu-west-3

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-${{ github.run_id }}
        # The role maximum session is 3600 s (ADR-0012).
        role-duration-seconds: "3600"
