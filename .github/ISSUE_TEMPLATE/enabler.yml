name: Enabler technique
description: Travail technique qui rend les stories possibles (EN-xx)
title: "EN-xx — "
labels:
  - type/enabler
body:
  - type: markdown
    attributes:
      value: |
        Un enabler est rattaché à **une seule** epic (sub-issue). Renseignez le titre avec l'identifiant `EN-xx`.
        Ne collez aucun secret ni donnée personnelle dans cette issue.
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Pourquoi ce travail technique est nécessaire, quelles stories il débloque.
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: Objectif (user story technique)
      description: Format « En tant que / je veux / afin de » (rôle OPS, QE, AS, SE...).
      placeholder: |
        En tant qu'ingénieur OPS,
        je veux un pipeline de plan en lecture seule sur chaque PR,
        afin de relire les changements d'infrastructure avant fusion.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critères d'acceptation
      description: Un scénario Gherkin par critère, numérotés AC1..n. Chaque AC sera couvert par un test automatisé ou un contrôle CI nommé d'après lui.
      placeholder: |
        Scénario: AC1 - Plan en lecture seule
          Étant donné une PR qui modifie `infra/**`
          Quand le workflow de plan s'exécute
          Alors un résumé du plan est publié en commentaire de la PR
      render: gherkin
    validations:
      required: true
  - type: textarea
    id: nfr
    attributes:
      label: Exigences non fonctionnelles
      description: Sécurité, coût, performance, maintenabilité. Écrire « Aucune » si non applicable.
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Notes techniques / décisions
      description: Pistes de conception, modules concernés, ADR à écrire ou déjà existants.
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dépendances
      description: Issues bloquantes ou bloquées (`#n`), éléments externes. Écrire « Aucune » si non applicable.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priorité (MoSCoW)
      options:
        - Must (priority/must)
        - Should (priority/should)
        - Could (priority/could)
        - Won't (priority/wont)
    validations:
      required: true
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: Critères d'acceptation couverts par des tests ou des contrôles automatisés
        - label: "`task check` vert en local et en CI"
        - label: Plan OpenTofu relu, aucun finding Checkov/Trivy sans skip justifié
        - label: README de module régénéré (`task docs`) et ADR rédigé si une décision a été prise
        - label: Issue mise à jour avec une courte note d'avancement
