# Single entry point for local work, git hooks and CI (CI calls `task <target>`, never re-implements commands).
#
# Run from a shell where mise is activated, or prefix: `mise exec -- task check`.
#
# Portability rules (macOS, native Windows PowerShell, Linux):
#   - Commands run in Task's built-in POSIX interpreter; no grep/find/sed/xargs/bash-only syntax.
#   - Directory checks use the interpreter's `[ -d ... ]`; every step is a no-op with a message when its target is missing.
#   - Steps that need a real bash are limited with `platforms:`.
# Secrets: this file never uses `dotenv:` and never reads .env or AWS credential files. mise loads .env, not Task.

version: '3'

silent: true
set: [errexit]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Setup
  # ---------------------------------------------------------------------------
  setup:
    desc: Install the pinned toolchain (mise) and activate git hooks (lefthook)
    cmds:
      - mise install
      - mise exec -- lefthook install

  # ---------------------------------------------------------------------------
  # Gate
  # ---------------------------------------------------------------------------
  check:
    desc: Pre-commit gate - fmt (check) + lint + security + unit tests + docs check
    cmds:
      - task: fmt:check
      - task: lint
      - task: sec
      - task: test:unit
      - task: docs:check
      - task: contracts

  # ---------------------------------------------------------------------------
  # Format
  # ---------------------------------------------------------------------------
  fmt:
    desc: Format OpenTofu files in place
    cmds:
      - cmd: |
          if [ -d infra ]; then
            tofu fmt -recursive infra
          else
            echo "fmt: infra/ not found, nothing to format"
          fi

  fmt:check:
    desc: Fail if OpenTofu files are not formatted
    cmds:
      - cmd: |
          if [ -d infra ]; then
            echo "==> tofu fmt -check"
            tofu fmt -check -recursive -diff infra
          else
            echo "fmt:check: infra/ not found, skipping"
          fi

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    desc: tofu validate + tflint + actionlint + zizmor (offline) + shellcheck
    cmds:
      - task: validate
      - task: lint:tf
      - task: lint:actions
      - task: lint:shell

  validate:
    desc: "tofu init -backend=false + tofu validate in every infra/modules/* and infra/stacks/*"
    cmds:
      - cmd: |
          ran=0
          for d in infra/modules/* infra/stacks/*; do
            if [ -d "$d" ]; then
              ran=1
              echo "==> tofu validate $d"
              tofu -chdir="$d" init -backend=false -input=false
              tofu -chdir="$d" validate
            fi
          done
          if [ "$ran" = 0 ]; then
            echo "validate: no module or stack found under infra/, skipping"
          fi

  lint:tf:
    desc: tflint (recursive, config .tflint.hcl)
    cmds:
      - cmd: |
          if [ -d infra ]; then
            echo "==> tflint"
            tflint --init --config "$PWD/.tflint.hcl"
            tflint --recursive --config "$PWD/.tflint.hcl"
          else
            echo "lint:tf: infra/ not found, skipping"
          fi

  lint:actions:
    desc: actionlint + zizmor --offline on GitHub workflows and composite actions
    cmds:
      - cmd: |
          found=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -e "$f" ]; then found=1; fi
          done
          if [ "$found" = 1 ]; then
            # Explicit config when one exists, so the file used is the one restored from the PR base in CI.
            cfg=""
            for c in .github/actionlint.yaml .github/actionlint.yml; do
              if [ -f "$c" ]; then
                cfg="$c"
                break
              fi
            done
            echo "==> actionlint"
            if [ -n "$cfg" ]; then
              actionlint -config-file "$cfg"
            else
              actionlint
            fi
            echo "==> zizmor --offline"
            zizmor --offline .github
          else
            echo "lint:actions: no workflow files, skipping"
          fi

  lint:shell:
    desc: shellcheck on .github/scripts and scripts/ci
    cmds:
      - cmd: |
          found=0
          for f in .github/scripts/*.sh scripts/ci/*.sh; do
            if [ -e "$f" ]; then
              found=1
              echo "==> shellcheck $f"
              shellcheck -x "$f"
            fi
          done
          if [ "$found" = 0 ]; then
            echo "lint:shell: no scripts in .github/scripts or scripts/ci, skipping"
          fi

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  sec:
    desc: gitleaks + checkov + trivy config
    cmds:
      - task: sec:secrets
      - task: sec:iac
      - task: sec:config

  sec:secrets:
    desc: gitleaks over the git history of the current branch (never opens the untracked local .env)
    cmds:
      - echo "==> gitleaks git"
      - gitleaks git --no-banner --redact --config .gitleaks.toml .

  sec:iac:
    desc: checkov on infra/ (terraform) and .github/ (github_actions + secrets); policies/ is added when present
    env:
      # Checkov skips paths starting with "." by default, which would skip .github.
      CKV_IGNORE_HIDDEN_DIRECTORIES: "false"
    cmds:
      - cmd: |
          extra=""
          if [ -d policies ]; then extra="--external-checks-dir policies"; fi
          ran=0
          if [ -d infra ]; then
            ran=1
            echo "==> checkov infra"
            checkov --config-file .checkov.yaml $extra -d infra
          fi
          if [ -d .github/workflows ]; then
            ran=1
            echo "==> checkov .github"
            checkov --config-file .checkov.yaml $extra -d .github
          fi
          if [ "$ran" = 0 ]; then
            echo "sec:iac: neither infra/ nor .github/workflows found, skipping"
          fi

  sec:config:
    desc: trivy config (misconfiguration scan of infra/, all severities, fails on findings)
    cmds:
      - cmd: |
          if [ -d infra ]; then
            echo "==> trivy config"
            trivy config --exit-code 1 --skip-check-update infra
          else
            echo "sec:config: infra/ not found, skipping"
          fi

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    desc: All offline tests (alias of test:unit)
    cmds:
      - task: test:unit

  test:unit:
    desc: tofu test per module (mocked providers) + service unit tests + attribution checker self-test
    cmds:
      - task: test:unit:tofu
      - task: test:unit:services
      - task: test:unit:scripts

  test:unit:services:
    desc: "pytest in every services/<name> that has a tests/ directory (offline, no AWS)"
    cmds:
      - cmd: |
          if [ -d services ]; then
            ran=0
            for d in services/*; do
              if [ -d "$d/tests" ]; then
                ran=1
                echo "==> pytest $d"
                ( cd "$d" && uv run --quiet --with pytest --python 3.13 python -m pytest tests/ -q )
              fi
            done
            if [ "$ran" = 0 ]; then
              echo "test:unit:services: no service has a tests/ directory, skipping"
            fi
          else
            echo "test:unit:services: services/ not found, skipping"
          fi
        platforms: [linux, darwin]
      - cmd: echo "test:unit:services - skipped on native Windows (CI covers it)"
        platforms: [windows]

  test:unit:tofu:
    desc: "tofu test in every infra/modules/<name> that has a tests/ directory"
    cmds:
      - cmd: |
          if [ -d infra/modules ]; then
            ran=0
            for d in infra/modules/*; do
              if [ -d "$d/tests" ]; then
                ran=1
                echo "==> tofu test $d"
                tofu -chdir="$d" init -backend=false -input=false
                tofu -chdir="$d" test
              fi
            done
            if [ "$ran" = 0 ]; then
              echo "test:unit:tofu: no module has a tests/ directory, skipping"
            fi
          else
            echo "test:unit:tofu: infra/modules not found, skipping"
          fi

  test:unit:scripts:
    desc: Self-test of .github/scripts/check-attribution.sh (needs bash)
    cmds:
      - cmd: |
          if [ -f .github/scripts/check-attribution.sh ]; then
            echo "==> check-attribution.sh --self-test"
            bash .github/scripts/check-attribution.sh --self-test
          else
            echo "test:unit:scripts: check-attribution.sh not found, skipping"
          fi
        platforms: [linux, darwin]
      - cmd: echo "test:unit:scripts - skipped on native Windows (needs bash; CI and the commit-msg hook cover it)"
        platforms: [windows]

  test:integration:
    desc: "tofu test against the dev account, needs AWS credentials: task test:integration ENV=dev"
    requires:
      vars:
        - name: ENV
          enum: [dev]
    env:
      TF_VAR_env: '{{.ENV}}'
    cmds:
      - cmd: |
          if [ -d infra/modules ]; then
            ran=0
            for d in infra/modules/*; do
              if [ -d "$d/tests-integration" ]; then
                ran=1
                echo "==> tofu test (integration, {{.ENV}}) $d"
                tofu -chdir="$d" init -backend=false -input=false
                tofu -chdir="$d" test -test-directory=tests-integration
              fi
            done
            if [ "$ran" = 0 ]; then
              echo "test:integration: no module has a tests-integration/ directory, skipping"
            fi
          else
            echo "test:integration: infra/modules not found, skipping"
          fi

  # ---------------------------------------------------------------------------
  # Plan (read-only)
  # ---------------------------------------------------------------------------
  plan:preflight:
    desc: "Provider allowlist + forbidden constructs gate, run BEFORE AWS credentials exist: TF_PLUGIN_CACHE_DIR=<dir> task plan:preflight STACK=platform"
    requires:
      vars:
        - name: STACK
          enum: [foundation, platform]
    env:
      PLAN_STACK: '{{.STACK}}'
    cmds:
      - cmd: bash scripts/ci/check-tofu-providers.sh "$PLAN_STACK"
        platforms: [linux, darwin]
      - cmd: echo "plan:preflight - skipped on native Windows (needs bash; CI runs it on Linux)"
        platforms: [windows]

  plan:
    desc: "Read-only plan (no state lock, no apply): task plan ENV=dev STACK=platform [OUT=<abs path of the plan file>]"
    requires:
      vars:
        - name: ENV
          enum: [dev, prod]
        - name: STACK
          enum: [foundation, platform]
    env:
      # Passed through the environment, never interpolated in the script. Empty means no -out.
      PLAN_OUT: '{{default "" .OUT}}'
    cmds:
      - cmd: |
          # Layout (ADR-0011): infra/envs/<env>/backend.hcl + infra/envs/<env>/<stack>.tfvars, state key <env>/<stack>.tfstate.
          # STATE_BUCKET and STATE_KMS_KEY_ARN (CI: GitHub variables) override the placeholders of backend.hcl.
          # TF_VAR_state_kms_key_arn is read by tofu directly from the environment.
          stack="infra/stacks/{{.STACK}}"
          envdir="infra/envs/{{.ENV}}"
          if [ -d "$stack" ] && [ -d "$envdir" ]; then
            echo "==> tofu plan {{.STACK}} ({{.ENV}}), read-only"
            set -- -input=false -reconfigure "-backend-config=$PWD/$envdir/backend.hcl" "-backend-config=key={{.ENV}}/{{.STACK}}.tfstate"
            if [ -n "${STATE_BUCKET:-}" ]; then
              set -- "$@" "-backend-config=bucket=$STATE_BUCKET"
            fi
            if [ -n "${STATE_KMS_KEY_ARN:-}" ]; then
              set -- "$@" "-backend-config=kms_key_id=$STATE_KMS_KEY_ARN"
            fi
            tofu -chdir="$stack" init "$@"
            set -- -input=false -lock=false "-var-file=$PWD/$envdir/{{.STACK}}.tfvars"
            if [ -n "${PLAN_OUT:-}" ]; then
              set -- "$@" "-out=$PLAN_OUT"
            fi
            tofu -chdir="$stack" plan "$@"
          else
            echo "plan: $stack or $envdir not found, nothing to plan"
          fi

  # ---------------------------------------------------------------------------
  # Apply (CI only, saved plan only)
  # ---------------------------------------------------------------------------
  apply:
    desc: "CI only. Apply a SAVED plan file (never plans, never auto-approves): task apply ENV=dev STACK=platform PLAN=<abs path of the file written by task plan OUT=...>"
    requires:
      vars:
        - name: ENV
          enum: [dev, prod]
        - name: STACK
          enum: [foundation, platform]
        - name: PLAN
    env:
      # Passed through the environment, never interpolated in the script.
      APPLY_PLAN: '{{.PLAN}}'
    cmds:
      - cmd: |
          # GitOps (ADR-0009): applies go through the CI. This is a guard against accidents, not a security boundary
          # (the real controls are the OIDC roles and the GitHub environments, ADR-0012).
          if [ "${GITHUB_ACTIONS:-}" != "true" ]; then
            echo "apply: refused outside GitHub Actions (GitOps, ADR-0009). Open a pull request instead." >&2
            exit 1
          fi
          # The plan path must be absolute: tofu runs with -chdir, a relative path would point elsewhere.
          case "$APPLY_PLAN" in
            /* | [A-Za-z]:*) ;;
            *)
              echo "apply: PLAN must be an absolute path" >&2
              exit 1
              ;;
          esac
          # No plan file, no apply. There is deliberately no -auto-approve and no fallback to a fresh plan: the plan
          # applied is the one that was computed earlier in the same job. A stale plan (state changed since) is
          # rejected by OpenTofu, and the answer is a new run, not a retry of this file.
          if [ ! -f "$APPLY_PLAN" ]; then
            echo "apply: plan file not found, refusing to apply without a saved plan" >&2
            exit 1
          fi
          stack="infra/stacks/{{.STACK}}"
          envdir="infra/envs/{{.ENV}}"
          if [ ! -d "$stack" ] || [ ! -d "$envdir" ]; then
            echo "apply: $stack or $envdir not found" >&2
            exit 1
          fi
          echo "==> tofu apply {{.STACK}} ({{.ENV}}), saved plan"
          # Same backend configuration as `task plan` (ADR-0011); the state lock is taken by apply.
          set -- -input=false -reconfigure "-backend-config=$PWD/$envdir/backend.hcl" "-backend-config=key={{.ENV}}/{{.STACK}}.tfstate"
          if [ -n "${STATE_BUCKET:-}" ]; then
            set -- "$@" "-backend-config=bucket=$STATE_BUCKET"
          fi
          if [ -n "${STATE_KMS_KEY_ARN:-}" ]; then
            set -- "$@" "-backend-config=kms_key_id=$STATE_KMS_KEY_ARN"
          fi
          tofu -chdir="$stack" init "$@"
          tofu -chdir="$stack" apply -input=false "$APPLY_PLAN"

  # ---------------------------------------------------------------------------
  # Contracts (API contract: OpenAPI + shared JSON Schemas)
  # ---------------------------------------------------------------------------
  contracts:
    desc: Lint the OpenAPI description and compile the shared JSON Schemas (packages/contracts)
    cmds:
      - cmd: |
          if [ -f packages/contracts/package.json ]; then
            echo "==> contracts: pnpm install + check"
            pnpm --dir packages/contracts install --frozen-lockfile
            pnpm --dir packages/contracts run check
          else
            echo "contracts: packages/contracts not found, skipping"
          fi

  # ---------------------------------------------------------------------------
  # Docs
  # ---------------------------------------------------------------------------
  docs:
    desc: Regenerate module READMEs (terraform-docs, inject mode)
    cmds:
      - task: _docs
        vars:
          FLAGS: ''

  docs:check:
    desc: Fail if a module README is out of date (terraform-docs --output-check)
    cmds:
      - task: _docs
        vars:
          FLAGS: '--output-check'

  _docs:
    internal: true
    cmds:
      - cmd: |
          if [ -d infra/modules ]; then
            echo "==> terraform-docs infra/modules {{.FLAGS}}"
            terraform-docs markdown table --recursive --recursive-path modules --recursive-include-main=false --output-file README.md --output-mode inject {{.FLAGS}} infra
          else
            echo "docs: infra/modules not found, skipping"
          fi

  # ---------------------------------------------------------------------------
  # Post-deploy tests
  # ---------------------------------------------------------------------------
  smoke:
    desc: "Hurl smoke tests (tests/smoke/*.hurl): task smoke ENV=dev"
    requires:
      vars:
        - name: ENV
          enum: [dev, prod]
    cmds:
      - cmd: |
          found=0
          for f in tests/smoke/*.hurl; do
            if [ -e "$f" ]; then found=1; fi
          done
          if [ "$found" = 1 ]; then
            vars=""
            if [ -f "tests/smoke/vars.{{.ENV}}.properties" ]; then
              vars="--variables-file tests/smoke/vars.{{.ENV}}.properties"
            fi
            echo "==> hurl smoke ({{.ENV}})"
            hurl --test --variable env={{.ENV}} $vars --glob "tests/smoke/*.hurl"
          else
            echo "smoke: no tests/smoke/*.hurl, skipping"
          fi

  perf:
    desc: "k6 load tests (tests/perf/*.js, thresholds fail the run): task perf ENV=dev"
    requires:
      vars:
        - name: ENV
          enum: [dev, prod]
    cmds:
      - cmd: |
          found=0
          for f in tests/perf/*.js; do
            if [ -e "$f" ]; then
              found=1
              echo "==> k6 $f ({{.ENV}})"
              k6 run -e ENV={{.ENV}} "$f"
            fi
          done
          if [ "$found" = 0 ]; then
            echo "perf: no tests/perf/*.js, skipping"
          fi
